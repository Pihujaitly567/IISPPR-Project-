<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Luxury Footer</title>

    <!-- GOOGLE FONTS -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- REMIX ICON -->

    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>



    
    <footer>
      <div class="footer-container">
        <!-- FIRST SECTION -->

        <div class="footer-section logo-section">
          <div class="logo-wrapper">
            <img
              src="https://play-lh.googleusercontent.com/IH1yKsOGNhqysO_5VYkYZ-sTqvWkPiRde5tsihxZXlr6eD2Jo3Jp14CALBFveySKrK1eZ3OL02O_Y0ZxQmQu=w240-h480-rw"
            />

            <div class="logo-text">
              <h2>ENTABLATURE</h2>

              <p>Ideas. Structure. Civilization.</p>
            </div>
          </div>

          <!-- ICONS -->

          <div class="social-icons">
            <i class="ri-linkedin-fill"></i>
            <i class="ri-twitter-x-line"></i>
            <i class="ri-youtube-fill"></i>
          </div>
        </div>

        <!-- SECOND -->

        <div class="footer-section">
          <h3>EXPLORE</h3>

          <a href="#">About</a>
          <a href="#">Insights</a>
          <a href="#">Publications</a>
          <a href="#">Initiatives</a>
        </div>

        <!-- THIRD -->

        <div class="footer-section">
          <h3>RESOURCES</h3>

          <a href="#">Articles</a>
          <a href="#">Reports</a>
          <a href="#">Events</a>
          <a href="#">Media</a>
        </div>

        <!-- FOURTH -->

        <div class="footer-section stay-section">
          <h3>STAY CONNECTED</h3>

          <p>Subscribe to our newsletter for the latest insights.</p>

          <div class="input-box">
            <input type="email" placeholder="Your email address" />

            <button>
              <i class="ri-arrow-right-line"></i>
            </button>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
