<!-- ===================== AD POPUP ===================== -->
<!-- 
    INTEGRATION GUIDE
    -----------------
    1. Copy this entire block into your page's <body> (just before </body>).
    2. Add in your <head>:
           <link rel="stylesheet" href="ad.css">
    3. Add before your closing </body>:
           <script src="ad.js"></script>
    4. Make sure images/popup_banner.jpg exists in your project.
-->

<div class="popup-overlay" id="popupOverlay">
    <div class="popup-box" id="popupBox">
        <button class="popup-close" id="popupClose" aria-label="Close popup">&times;</button>
        <a href="https://iisppracademy.com" target="_blank" class="popup-link" id="popupLink">
            <!-- Banner image fills the entire popup via ad.css background-image -->
        </a>
    </div>
</div>
